name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'freQuensy23-coder/hermes-phonebridge' && github.actor == 'freQuensy23-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require accepted main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor "$REVISION" origin/main
          gh api "repos/$REPOSITORY/commits/$REVISION/check-runs" > "$RUNNER_TEMP/checks.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/checks.json")); c={x["name"]:x["conclusion"] for x in d["check_runs"]}; required=["security","python","android-build","android-e2e (31)","android-e2e (35)"]; assert all(c.get(k)=="success" for k in required),c'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: python -m pip install build==1.2.2.post1 && python -m build server --outdir dist && python -m build cli --outdir dist
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
        working-directory: android
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Sign stable release APK
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: phonebridge
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD"
          keyfile="$RUNNER_TEMP/phonebridge-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf %s "$SIGNING_KEY" | base64 -d > "$keyfile"
          chmod 600 "$keyfile"
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*-unsigned.apk)
          test "${#apks[@]}" = 1
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_ALIAS" --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out dist/phonebridge-android.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/phonebridge-android.apk
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "PhoneBridge $TAG" --generate-notes -- ./*.apk ./*.whl ./*.tar.gz SHA256SUMS
