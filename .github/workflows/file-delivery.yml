name: One-way file delivery
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: file-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-file-delivery:
    name: file-delivery Python contract
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install real server and CLI with test dependencies
        run: python -m pip install './server[test]' './cli[test]'
      - name: Required file upload server and installed CLI tests
        run: python3 ci/run_file_delivery.py python-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: file-delivery-python-${{ github.sha }}
          path: ${{ runner.temp }}/file-delivery-python-evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
  android-file-delivery:
    name: file-delivery API ${{ matrix.api }}
    needs: [python-file-delivery]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    env:
      FILE_DELIVERY_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
          add-job-summary: never
      - name: Install real server and CLI with test dependencies
        run: python -m pip install './server[test]' './cli[test]'
      - name: Assemble isolated APKs without publishing private Gradle output
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest > "$RUNNER_TEMP/file-delivery-build-private.log" 2>&1
      - name: Allow disposable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start synthetic public TLS and authenticated WSS server
        run: python3 ci/prepare_emulator_server.py start
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          script: python3 ci/run_file_delivery.py run
      - name: Bounded synthetic server cleanup
        if: always()
        run: timeout 40s python3 ci/prepare_emulator_server.py stop
      - name: Publish only observed JUnit and bounded native readback summary
        if: always()
        run: python3 ci/run_file_delivery.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: file-delivery-api${{ matrix.api }}-${{ github.sha }}
          path: ${{ runner.temp }}/file-delivery-evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Remove private build output
        if: always()
        run: rm -f -- "$RUNNER_TEMP/file-delivery-build-private.log"
