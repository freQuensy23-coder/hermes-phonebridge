name: Experimental debug control
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: debug-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-control:
    name: debug-control API ${{ matrix.api }}
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Required debug workflow source policy tests
        run: |
          python -m pip install ./server pytest==8.3.5
          python -m pytest ci/tests/test_debug_workflow_policy.py ci/tests/test_android_suite_routing.py -q
      - name: Required exact debug unit suites and isolated APKs
        working-directory: android
        run: |
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          path = Path("app/build/test-results/testDebugUnitTest")
          if path.exists():
              shutil.rmtree(path)
          PY
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest --tests org.nous.phonebridge.DebugControlTest --tests org.nous.phonebridge.DebugPayloadBoundsTest --tests org.nous.phonebridge.DebugExecutionGuardTest --tests org.nous.phonebridge.RemoteWindowPolicyTest
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :debugfixture:assembleDebug
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = {
              "org.nous.phonebridge.DebugControlTest": "deadlineRejectsAtExactBoundaryWithoutTimer",
              "org.nous.phonebridge.DebugPayloadBoundsTest": None,
              "org.nous.phonebridge.DebugExecutionGuardTest": None,
              "org.nous.phonebridge.RemoteWindowPolicyTest": None,
          }
          for classname, boundary in required.items():
              path = Path("app/build/test-results/testDebugUnitTest") / ("TEST-" + classname + ".xml")
              report = ET.parse(path).getroot()
              cases = report.findall("testcase")
              assert cases, "Required debug unit suite must execute"
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped")) for case in cases)
              if boundary is not None:
                  assert any(case.attrib.get("name") == boundary for case in cases)
          PY
      - name: Retrieve exact genuine Google Clock fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 120s gh release download phonebridge-ci-vendor-fixtures --repo freQuensy23-coder/hermes-phonebridge --pattern google-8.2.apk --dir "$RUNNER_TEMP/clock-fixture"
          printf '%s  %s\n' 'cf71cbc0728bb44e37d5ad19772b6ae9b39aae07b46945e7cde3a930cbccd383' "$RUNNER_TEMP/clock-fixture/google-8.2.apk" | sha256sum --check --status
      - name: Allow ephemeral emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start synthetic public HTTPS and authenticated WSS server
        run: python3 ci/prepare_emulator_server.py start
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/run_debug_instrumentation.sh
      - name: Bounded synthetic server cleanup
        if: always()
        run: timeout 40s python3 ci/prepare_emulator_server.py stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: debug-control-api${{ matrix.api }}-${{ github.sha }}
          path: ${{ runner.temp }}/debug-control-evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
