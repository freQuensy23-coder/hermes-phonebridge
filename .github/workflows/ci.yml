name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./server -e ./cli pip-audit==2.10.1 zizmor==1.30.1
      - name: Audit installed runtime dependency declarations
        run: |
          python -c 'import os,tomllib; from pathlib import Path; data=tomllib.loads(Path("cli/pyproject.toml").read_text()); Path(os.environ["RUNNER_TEMP"]+"/cli-runtime-requirements.txt").write_text("\n".join(data["project"]["dependencies"])+"\n")'
          python -m pip_audit --strict --requirement server/requirements.txt --requirement "$RUNNER_TEMP/cli-runtime-requirements.txt" --format json --output security-audit.json
      - name: Collect every workflow audit finding and classify reviewed limitations
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          zizmor --no-ignores --persona auditor --strict-collection --format=json-v1 .github/workflows > workflow-audit.json
          result=$?
          set -e
          case "$result" in 0|11|12|13|14) ;; *) exit "$result" ;; esac
          python ci/classify_workflow_audit.py workflow-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-${{ github.sha }}
          path: |
            security-audit.json
            workflow-audit.json
            workflow-audit-classified.json
          if-no-files-found: error
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install './server[test]' './cli[test]' ruff==0.11.13
      - run: python -m ruff check server cli deploy ci
      - run: python -m pytest server/tests cli/tests deploy/tests ci/tests -q --junitxml=python-results.xml
      - run: python -m build server --outdir dist && python -m build cli --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-${{ github.sha }}
          path: |
            python-results.xml
            dist/
          if-no-files-found: error
  android-build:
    name: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/
            android/app/build/test-results/
          if-no-files-found: error
  android-e2e:
    name: android-e2e (${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - run: python -m pip install ./server
      - name: Start isolated test server
        env:
          PHONEBRIDGE_ADMIN_TOKEN: ci-phonebridge-test-admin-token-000000000000000000
          PHONEBRIDGE_PUBLIC_URL: http://10.0.2.2:18940
          PHONEBRIDGE_ALLOW_INSECURE: 'true'
          PHONEBRIDGE_DB_PATH: ${{ runner.temp }}/phonebridge.sqlite3
          PHONEBRIDGE_REVISION: ${{ github.sha }}
        run: |
          python -m uvicorn phonebridge_server.app:create_app --factory --host 0.0.0.0 --port 18940 > "$RUNNER_TEMP/phonebridge-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18940/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd android && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://10.0.2.2:18940 -Pandroid.testInstrumentationRunnerArguments.adminToken=ci-phonebridge-test-admin-token-000000000000000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emulator-api${{ matrix.api }}-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/phonebridge-server.log
          if-no-files-found: error
