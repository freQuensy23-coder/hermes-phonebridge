name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./server -e ./cli pip-audit==2.10.1 zizmor==1.30.1
      - name: Audit installed runtime dependency declarations
        run: |
          python -c 'import os,tomllib; from pathlib import Path; data=tomllib.loads(Path("cli/pyproject.toml").read_text()); Path(os.environ["RUNNER_TEMP"]+"/cli-runtime-requirements.txt").write_text("\n".join(data["project"]["dependencies"])+"\n")'
          python -m pip_audit --strict --requirement server/requirements.txt --requirement "$RUNNER_TEMP/cli-runtime-requirements.txt" --format json --output security-audit.json
      - name: Collect every workflow audit finding and classify reviewed limitations
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          zizmor --no-ignores --persona auditor --strict-collection --format=json-v1 .github/workflows > workflow-audit.json
          result=$?
          set -e
          case "$result" in 0|11|12|13|14) ;; *) exit "$result" ;; esac
          python ci/classify_workflow_audit.py workflow-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-${{ github.sha }}
          overwrite: true
          path: |
            security-audit.json
            workflow-audit.json
            workflow-audit-classified.json
          if-no-files-found: error
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install './server[test]' './cli[test]' ruff==0.11.13
      - run: python -m ruff check server cli deploy ci release
      - run: python -m pytest server/tests cli/tests deploy/tests ci/tests release/tests -q --junitxml=python-results.xml
      - run: python -m build server --outdir dist && python -m build cli --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-${{ github.sha }}
          overwrite: true
          path: |
            python-results.xml
            dist/
          if-no-files-found: error
  android-build:
    name: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: chmod +x gradlew && ./gradlew --no-daemon --refresh-dependencies testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-${{ github.sha }}
          overwrite: true
          path: |
            android/app/build/outputs/apk/
            android/app/build/test-results/
          if-no-files-found: error
  android-e2e:
    name: android-e2e (${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Prepare isolated Android runner capacity and KVM
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet
          df -h "$HOME"
          sudo chmod 666 /dev/kvm
      - run: python -m pip install ./server ./cli
      - name: Start isolated HTTPS test server
        env:
          PHONEBRIDGE_REVISION: ${{ github.sha }}
        run: python3 ci/prepare_emulator_server.py start
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          script: bash ci/run_android_instrumentation.sh
      - name: Stop isolated server and HTTPS tunnel
        if: always()
        run: python3 ci/prepare_emulator_server.py stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emulator-api${{ matrix.api }}-${{ github.sha }}
          overwrite: true
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/phonebridge-server.log
            ${{ runner.temp }}/phonebridge-tunnel.log
            ${{ runner.temp }}/qr-fixture-http.log
            ${{ runner.temp }}/screenshots/
          if-no-files-found: error

  release-input:
    name: release-input
    needs: [security, python, android-build, android-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-${{ github.sha }}
          path: ${{ runner.temp }}/input/python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-${{ github.sha }}
          path: ${{ runner.temp }}/input/android
      - name: Package exact accepted CI outputs without rebuilding
        run: python release/prepare.py --python-dist "$RUNNER_TEMP/input/python/dist" --apk "$RUNNER_TEMP/input/android/outputs/apk/release/app-release-unsigned.apk" --output "$RUNNER_TEMP/release-input" --lock server/requirements.txt --lock server/pyproject.toml --lock cli/pyproject.toml --lock android/app/build.gradle.kts --lock android/build.gradle.kts --lock android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phonebridge-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-input/
          overwrite: true
          if-no-files-found: error
  deployment-artifact:
    name: deployment-artifact
    needs: [security, python, android-build, android-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-${{ github.sha }}
          path: ${{ runner.temp }}/input/python
      - name: Resolve exact producer identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id=$(gh api "repos/freQuensy23-coder/hermes-phonebridge/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          printf 'PHONEBRIDGE_CI_WORKFLOW_ID=%s\n' "$workflow_id" >> "$GITHUB_ENV"
      - name: Collect pinned offline runtime wheels and bound manifest
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheelhouse" --requirement server/requirements.txt "$RUNNER_TEMP/input/python/dist/phonebridge_server-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/input/python/dist/phonebridge_cli-0.1.0-py3-none-any.whl"
          python ci/smoke_offline_runtime.py --wheelhouse "$RUNNER_TEMP/wheelhouse" --revision "$GITHUB_SHA"
          python deploy/package_artifact.py --wheelhouse "$RUNNER_TEMP/wheelhouse" --output "$RUNNER_TEMP/deployment-artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phonebridge-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-artifact/
          overwrite: true
          if-no-files-found: error

  offline-runtime:
    name: offline-runtime
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-${{ github.sha }}
          path: ${{ runner.temp }}/offline-input/python
      - name: Exercise actual CI wheel closure without source imports
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/offline-wheelhouse" --requirement server/requirements.txt "$RUNNER_TEMP/offline-input/python/dist/phonebridge_server-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/offline-input/python/dist/phonebridge_cli-0.1.0-py3-none-any.whl"
          python ci/smoke_offline_runtime.py --wheelhouse "$RUNNER_TEMP/offline-wheelhouse" --revision "$GITHUB_SHA"
